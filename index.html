```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عندك مفاجأة 🎁</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #191526, #382447, #20182f);
}

.card {
    width: 90%;
    max-width: 430px;
    padding: 35px 22px;
    border: 1px solid #a778b8;
    border-radius: 25px;
    background: rgba(255,255,255,0.06);
    box-shadow: 0 0 35px #0004;
}

.gift { font-size: 75px; }

h1 { color: #f0b4f2; }

p {
    font-size: 18px;
    line-height: 1.8;
}

button {
    border: none;
    border-radius: 30px;
    padding: 15px 25px;
    margin-top: 15px;
    background: #e9a9ed;
    color: #24172c;
    font-size: 18px;
    cursor: pointer;
}

#surprise { display: none; }

.heart {
    font-size: 35px;
    animation: bounce 1s infinite alternate;
}

@keyframes bounce {
    from { transform: scale(1); }
    to { transform: scale(1.2); }
}
</style>
</head>

<body>
<div class="card">
    <div class="gift" id="gift">🎁</div>

    <div id="start">
        <h1>عندك مفاجأة سرية! 👀</h1>
        <p>في إشي إلك هون... بس لازم تضغط عشان تعرف شو هو 🤭</p>
        <button onclick="reveal()">اكشف المفاجأة 💗</button>
    </div>

    <div id="surprise">
        <div class="heart">💗</div>
        <h1>انمسكتتت 😂</h1>
        <p>فضولك ما خلاك تقاوم وتضغط، صح؟ 😭😂</p>
        <p>مبروك! ربحت لقب أكثر شخص فضولي اليوم 🏆</p>
        <button onclick="again()">أعيد المقلب؟ 🤣</button>
    </div>
</div>

<script>
function reveal() {
    document.getElementById("start").style.display = "none";
    document.getElementById("surprise").style.display = "block";
    document.getElementById("gift").textContent = "🤭";
}

function again() {
    document.getElementById("surprise").style.display = "none";
    document.getElementById("start").style.display = "block";
    document.getElementById("gift").textContent = "🎁";
}
</script>
</body>
</html>
```
