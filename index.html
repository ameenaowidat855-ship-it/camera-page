<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مفاجأة إلك 🎁</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid;
  place-items: center; font-family: Arial, sans-serif;
  color: white; text-align: center;
  background: linear-gradient(135deg,#191526,#382447,#20182f);
}
.card {
  width: 90%; max-width: 500px; padding: 30px 22px;
  border: 1px solid #a778b8; border-radius: 24px;
  background: #ffffff0b;
}
h1 { color: #f0b4f2; }
p { line-height: 1.9; }
button {
  border: 0; border-radius: 30px; padding: 14px 22px;
  margin: 8px; background: #e9a9ed; color: #24172c;
  font-size: 17px; cursor: pointer;
}
video, canvas {
  width: 100%; margin-top: 15px; border-radius: 14px;
  background: #08070a;
}
[hidden] { display: none !important; }
#message { color: #f0b4f2; }
</style>
</head>
<body>
<main class="card">
  <div style="font-size:65px" id="emoji">🎁</div>
  <section id="surprise">
    <h1>عندك مفاجأة سرية! 👀</h1>
    <p>في إشي إلك هون... عندك فضول تعرف شو هو؟ 🤭</p>
    <button id="reveal">اكشف المفاجأة 💗</button>
  </section>

  <section id="result" hidden>
    <h1>انمسكتتت 😂</h1>
    <p>فضولك غلبك! ربحت لقب أكثر شخص فضولي اليوم 🏆</p>
    <p>بدك تجرب الكاميرا؟ افتحها بنفسك بعد الموافقة.</p>
    <button id="open">📸 افتح الكاميرا</button>
    <video id="camera" autoplay playsinline hidden></video>
    <button id="take" hidden>التقط صورة</button>
    <canvas id="photo" hidden></canvas>
    <button id="save" hidden>احفظ الصورة</button>
    <p id="message" role="status"></p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let stream = null;

$("reveal").addEventListener("click", () => {
  $("surprise").hidden = true;
  $("result").hidden = false;
  $("emoji").textContent = "🤭";
});

$("open").addEventListener("click", async () => {
  if (!navigator.mediaDevices?.getUserMedia) {
    $("message").textContent =
      "افتح الرابط عبر HTTPS وبمتصفح يدعم الكاميرا.";
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" }, audio: false
    });
    $("camera").srcObject = stream;
    $("camera").hidden = false;
    $("take").hidden = false;
    $("message").textContent =
      "الكاميرا تعمل. الصورة لن تُرسل إلى أي مكان.";
  } catch {
    $("message").textContent =
      "لم تُفتح الكاميرا. تأكد من السماح باستخدامها.";
  }
});

$("take").addEventListener("click", () => {
  const video = $("camera");
  if (!stream || !video.videoWidth) return;
  const canvas = $("photo");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);
  canvas.hidden = false;
  $("save").hidden = false;
  $("message").textContent = "تم التقاط الصورة على جهازك.";
});

$("save").addEventListener("click", () => {
  const link = document.createElement("a");
  link.download = "my-photo.png";
  link.href = $("photo").toDataURL("image/png");
  link.click();
});
